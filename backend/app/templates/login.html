<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Connexion — RFID Printing</title>

    <!-- Servis localement (/static/vendor/), voir base.html -->
    <link href="/static/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="/static/vendor/nunito/nunito.css" rel="stylesheet">
    <link href="/static/vendor/sb-admin-2/css/sb-admin-2.min.css" rel="stylesheet">

    <link href="/static/css/app.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-xl-5 col-lg-6 col-md-8" style="margin-top: 10vh;">

            <div class="card shadow-lg o-hidden border-0">

                <div class="card-body p-5">

                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-4">
                            <i class="fas fa-tags"></i> RFID Printing
                        </h1>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="post" action="/login">

                        <input type="hidden" name="next" value="{{ next }}">

                        <div class="form-group">
                            <input
                                type="text"
                                class="form-control form-control-user"
                                name="username"
                                placeholder="Identifiant"
                                required
                                autofocus
                            >
                        </div>

                        <div class="form-group">
                            <input
                                type="password"
                                class="form-control form-control-user"
                                name="password"
                                placeholder="Mot de passe"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            Se connecter
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
